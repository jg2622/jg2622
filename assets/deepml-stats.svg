<svg
    xmlns="http://www.w3.org/2000/svg"
    width="500"
    height="190"
    viewBox="0 0 500 190"
    role="img"
    aria-label="Deep-ML Stats"
>

    <!-- Background -->

    <rect
        x="0.5"
        y="0.5"
        width="499"
        height="189"
        rx="12"
        fill="#ffffff"
        stroke="#d0d7de"
    />

    <!-- Deep-ML Logo -->

    

    <!-- Title -->

    <text
        x="74"
        y="43"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="21"
        font-weight="600"
        fill="#24292f"
    >
        Deep-ML
    </text>

    <!-- Total solved -->

    <text
        x="455"
        y="43"
        text-anchor="end"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="18"
        font-weight="600"
        fill="#24292f"
    >
        8 solved
    </text>

    <!-- Circle background -->

    <circle
        cx="100"
        cy="112"
        r="43"
        fill="none"
        stroke="#eaeef2"
        stroke-width="7"
    />

    <!-- Circle difficulty distribution -->

    <circle
        cx="100"
        cy="112"
        r="43"
        fill="none"
        stroke="#22c55e"
        stroke-width="7"
        stroke-linecap="round"
        stroke-dasharray="168.86 101.32"
        stroke-dashoffset="-0.00"
        transform="rotate(-90 100 112)"
    />
<circle
        cx="100"
        cy="112"
        r="43"
        fill="none"
        stroke="#f4b400"
        stroke-width="7"
        stroke-linecap="round"
        stroke-dasharray="101.32 168.86"
        stroke-dashoffset="-168.86"
        transform="rotate(-90 100 112)"
    />

    <!-- Number inside circle -->

    <text
