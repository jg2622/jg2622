<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="190"
     viewBox="0 0 500 190"
     role="img"
     aria-label="Deep-ML Stats">

  <!-- Background -->
  <rect
    x="0.5"
    y="0.5"
    width="499"
    height="189"
    rx="12"
    fill="#ffffff"
    stroke="#d0d7de"
  />

<!-- Deep-ML Logo -->
<rect
  x="28"
  y="18"
  width="32"
  height="32"
  rx="7"
  fill="#111827"
/>

<text
  x="44"
  y="39"
  text-anchor="middle"
  font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
  font-size="10"
  font-weight="700"
  fill="#ffffff">
  DML
</text>

<!-- Title -->
<text
  x="72"
  y="42"
  font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
  font-size="21"
  font-weight="600"
  fill="#24292f">
  Deep-ML
</text>

  <!-- Total -->
  <text
    x="455"
    y="36"
    text-anchor="end"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="18"
    font-weight="600"
    fill="#24292f">
    2 solved
  </text>

  <!-- Circle background -->
  <circle
    cx="100"
    cy="112"
    r="43"
    fill="none"
    stroke="#eaeef2"
    stroke-width="7"
  />

  <!-- Circle progress -->
  <circle
    cx="100"
    cy="112"
    r="43"
    fill="none"
    stroke="#22c55e"
    stroke-width="7"
    stroke-linecap="round"
    stroke-dasharray="270"
    stroke-dashoffset="269"
    transform="rotate(-90 100 112)"
  />

  <!-- Total solved inside circle -->
  <text
    x="100"
    y="110"
    text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="28"
    font-weight="600"
    fill="#24292f">
    2
  </text>

  <text
    x="100"
    y="130"
    text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="12"
    fill="#57606a">
    Solved
  </text>

  <!-- EASY -->
  <circle cx="185" cy="77" r="5" fill="#22c55e"/>

  <text
    x="200"
    y="82"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16"
    font-weight="600"
    fill="#24292f">
    Easy
  </text>

  <text
    x="450"
    y="82"
    text-anchor="end"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16"
    font-weight="600"
    fill="#57606a">
    2
  </text>

  <line
    x1="200"
    y1="91"
    x2="450"
    y2="91"
    stroke="#eaeef2"
    stroke-width="5"
    stroke-linecap="round"
  />

  <line
    x1="200"
    y1="91"
    x2="450"
    y2="91"
    stroke="#22c55e"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- MEDIUM -->
  <circle cx="185" cy="112" r="5" fill="#eab308"/>

  <text
    x="200"
    y="117"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16"
    font-weight="600"
    fill="#24292f">
    Medium
  </text>

  <text
    x="450"
    y="117"
    text-anchor="end"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16"
    font-weight="600"
    fill="#57606a">
    0
  </text>

  <line
    x1="200"
    y1="126"
    x2="450"
    y2="126"
    stroke="#eaeef2"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- HARD -->
  <circle cx="185" cy="147" r="5" fill="#ef4444"/>

  <text
    x="200"
    y="152"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16"
    font-weight="600"
    fill="#24292f">
    Hard
  </text>

  <text
    x="450"
    y="152"
    text-anchor="end"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16"
    font-weight="600"
    fill="#57606a">
    0
  </text>

  <line
    x1="200"
    y1="161"
    x2="450"
    y2="161"
    stroke="#eaeef2"
    stroke-width="5"
    stroke-linecap="round"
  />

</svg>
